AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infraestructura para SvvS Kiosko: web, releases, autenticación y descarga personalizada.

# ============================================================================
# PARAMETROS
# ============================================================================
Parameters:
  ProjectName:
    Type: String
    Default: svvs-kiosko
    Description: Prefijo para nombrar recursos

  # Descomenta si tienes dominio propio y certificado ACM
  # DomainName:
  #   Type: String
  #   Default: descargas.tukiosko.com
  #   Description: Dominio personalizado para CloudFront
  # AcmCertificateArn:
  #   Type: String
  #   Description: ARN del certificado ACM en us-east-1

# ============================================================================
# RECURSOS
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # S3: Bucket para la web estática
  # --------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-web'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

  # --------------------------------------------------------------------------
  # S3: Bucket para los releases (.exe, latest.yml)
  # --------------------------------------------------------------------------
  ReleasesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-releases'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ReleasesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleasesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ReleasesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'

  # --------------------------------------------------------------------------
  # S3: Bucket para los sellos (imágenes de fondo y logo)
  # --------------------------------------------------------------------------
  StampsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-stamps'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # CloudFront: Origin Access Control
  # --------------------------------------------------------------------------
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --------------------------------------------------------------------------
  # CloudFront: Distribución
  # --------------------------------------------------------------------------
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} - Web + Releases + API'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100

        ViewerCertificate:
          CloudFrontDefaultCertificate: true

        Origins:
          # Origen 1: Web estática
          - Id: S3WebOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

          # Origen 2: Releases
          - Id: S3ReleasesOrigin
            DomainName: !GetAtt ReleasesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: S3WebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

        CacheBehaviors:
          # Releases (descargas .exe)
          - PathPattern: '/releases/*'
            TargetOriginId: S3ReleasesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # Cognito: User Pool para autenticación
  # --------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameConfiguration:
        CaseSensitive: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # --------------------------------------------------------------------------
  # DynamoDB: Tabla de usuarios (configuración extendida)
  # --------------------------------------------------------------------------
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # DynamoDB: Tabla catálogo de sellos
  # --------------------------------------------------------------------------
  StampCatalogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-stamp-catalog'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: stampId
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
        - AttributeName: stampId
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # IAM: Rol para las Lambdas
  # --------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAuth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:InitiateAuth
                  - cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt UsersTable.Arn
        - PolicyName: S3ReadReleases
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${ReleasesBucket.Arn}/*'
        - PolicyName: S3StampsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt StampsBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${StampsBucket.Arn}/*'
        - PolicyName: DynamoDBStampCatalogAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt StampCatalogTable.Arn

  # --------------------------------------------------------------------------
  # Lambda: Login
  # --------------------------------------------------------------------------
  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-login'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
      Code:
        ZipFile: |
          // Placeholder - se actualiza con deploy de lambda
          exports.handler = async (event) => {
            return { statusCode: 200, body: 'login placeholder' };
          };
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # Lambda: Download (genera config.json + presigned URL)
  # --------------------------------------------------------------------------
  DownloadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-download'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
          RELEASES_BUCKET: !Ref ReleasesBucket
      Code:
        ZipFile: |
          // Placeholder - se actualiza con deploy de lambda
          exports.handler = async (event) => {
            return { statusCode: 200, body: 'download placeholder' };
          };
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # API Gateway: REST API
  # --------------------------------------------------------------------------
  KioskoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api'
      Description: API para login y descarga personalizada
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /api resource
  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !GetAtt KioskoApi.RootResourceId
      PathPart: api

  # /api/login
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !Ref ApiResource
      PathPart: login

  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginFunction.Arn}/invocations'

  LoginOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref LoginResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /api/download
  DownloadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !Ref ApiResource
      PathPart: download

  DownloadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref DownloadResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DownloadFunction.Arn}/invocations'

  DownloadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref DownloadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Deploy de la API
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - LoginMethod
      - DownloadMethod
      - LoginOptionsMethod
      - DownloadOptionsMethod
      - ActivateMethod
      - ActivateOptionsMethod
      - DeactivateMethod
      - DeactivateOptionsMethod
      - SyncStampsMethod
      - SyncStampsOptionsMethod
    Properties:
      RestApiId: !Ref KioskoApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref KioskoApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  # Permisos para que API Gateway invoque las Lambdas
  LoginFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LoginFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KioskoApi}/*/POST/api/login'

  DownloadFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DownloadFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KioskoApi}/*/GET/api/download'

  # --------------------------------------------------------------------------
  # Lambda: Activate License
  # --------------------------------------------------------------------------
  ActivateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-activate'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return { statusCode: 200, body: 'activate placeholder' };
          };
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # Lambda: Deactivate License
  # --------------------------------------------------------------------------
  DeactivateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-deactivate'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            return { statusCode: 200, body: 'deactivate placeholder' };
          };
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # --------------------------------------------------------------------------
  # Lambda: Sync Stamps (escanea S3, sincroniza DynamoDB, genera presigned URLs)
  # --------------------------------------------------------------------------
  SyncStampsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-sync-stamps'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          STAMPS_BUCKET: !Ref StampsBucket
          STAMP_CATALOG_TABLE: !Ref StampCatalogTable
      Code:
        ZipFile: |
          // Placeholder - se actualiza con deploy de lambda
          exports.handler = async (event) => {
            return { statusCode: 200, body: 'sync-stamps placeholder' };
          };
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # /api/stamps
  StampsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !Ref ApiResource
      PathPart: stamps

  # /api/stamps/sync
  StampsSyncResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !Ref StampsResource
      PathPart: sync

  SyncStampsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref StampsSyncResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyncStampsFunction.Arn}/invocations'

  SyncStampsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref StampsSyncResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /api/activate
  ActivateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !Ref ApiResource
      PathPart: activate

  ActivateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref ActivateResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ActivateFunction.Arn}/invocations'

  ActivateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref ActivateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # /api/deactivate
  DeactivateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref KioskoApi
      ParentId: !Ref ApiResource
      PathPart: deactivate

  DeactivateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref DeactivateResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeactivateFunction.Arn}/invocations'

  DeactivateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref KioskoApi
      ResourceId: !Ref DeactivateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  ActivateFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ActivateFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KioskoApi}/*/POST/api/activate'

  DeactivateFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DeactivateFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KioskoApi}/*/POST/api/deactivate'

  SyncStampsFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SyncStampsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${KioskoApi}/*/POST/api/stamps/sync'

# ============================================================================
# OUTPUTS
# ============================================================================
Outputs:
  WebBucketName:
    Description: Nombre del bucket S3 para la web
    Value: !Ref WebBucket
    Export:
      Name: !Sub '${ProjectName}-web-bucket'

  ReleasesBucketName:
    Description: Nombre del bucket S3 para las releases
    Value: !Ref ReleasesBucket
    Export:
      Name: !Sub '${ProjectName}-releases-bucket'

  CloudFrontDomainName:
    Description: URL de la distribución CloudFront
    Value: !GetAtt WebDistribution.DomainName
    Export:
      Name: !Sub '${ProjectName}-cloudfront-domain'

  CloudFrontDistributionId:
    Description: ID de la distribución (para invalidaciones)
    Value: !Ref WebDistribution
    Export:
      Name: !Sub '${ProjectName}-cloudfront-id'

  ApiGatewayUrl:
    Description: URL base del API Gateway
    Value: !Sub 'https://${KioskoApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: !Sub '${ProjectName}-api-url'

  UserPoolId:
    Description: ID del User Pool de Cognito
    Value: !Ref UserPool
    Export:
      Name: !Sub '${ProjectName}-user-pool-id'

  UserPoolClientId:
    Description: ID del cliente de Cognito
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub '${ProjectName}-user-pool-client-id'

  UsersTableName:
    Description: Nombre de la tabla DynamoDB de usuarios
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${ProjectName}-users-table'

  StampsBucketName:
    Description: Nombre del bucket S3 para los sellos
    Value: !Ref StampsBucket
    Export:
      Name: !Sub '${ProjectName}-stamps-bucket'

  StampCatalogTableName:
    Description: Nombre de la tabla DynamoDB del catálogo de sellos
    Value: !Ref StampCatalogTable
    Export:
      Name: !Sub '${ProjectName}-stamp-catalog-table'

